name: Deploy Web

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: justin-croyable-story
  HOSTING_TARGET: potager
  ENV_FILE: packages/potager-web/src/environments/environment.production.ts
  API_URL_PLACEHOLDER: https://REMPLACER-PAR-URL-CLOUD-RUN

jobs:
  deploy:
    name: Build & déploiement front
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
      # nrwl/nx-set-shas interroge l'API Actions sur un push master pour
      # trouver le dernier run réussi (base du diff affected).
      actions: read
    steps:
      # Tant que le secret FIREBASE_SERVICE_ACCOUNT n'est pas configuré, tout est
      # ignoré : le job reste vert (même logique de garde que le backend).
      - name: Firebase configuré ?
        id: cfg
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Déploiement front ignoré : secret FIREBASE_SERVICE_ACCOUNT absent. Voir docs/deploy-frontend.md."
          fi

      - name: Checkout
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: SHAs de base pour nx affected
        if: steps.cfg.outputs.ready == 'true'
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master

      - name: Install dependencies
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      # Ne (re)build/déploie le front que s'il est réellement impacté (lui ou
      # une de ses libs). Évite de rebuilder à chaque push, y compris back-only.
      - name: Front affecté ?
        id: affected
        if: steps.cfg.outputs.ready == 'true'
        run: |
          if AFFECTED=$(npx nx show projects --affected --json 2>/dev/null); then
            echo "web=$(echo "$AFFECTED" | grep -q 'potager-web' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

      # L'URL de l'API de staging (Cloud Run) est injectée dans le fichier
      # d'environnement de production avant le build. Sans le secret, on garde
      # le placeholder (le build reste fonctionnel mais l'API est injoignable).
      - name: Injecte l'URL de l'API de staging
        if: steps.cfg.outputs.ready == 'true' && steps.affected.outputs.web == 'true'
        env:
          STAGING_API_URL: ${{ secrets.GARDEN_HARVEST_STAGING_API_URL }}
        run: |
          if [ -n "$STAGING_API_URL" ]; then
            sed -i "s|${API_URL_PLACEHOLDER}|${STAGING_API_URL}|" "$ENV_FILE"
          else
            echo "::warning::GARDEN_HARVEST_STAGING_API_URL absent : le front pointera vers le placeholder."
          fi

      - name: Build
        if: steps.cfg.outputs.ready == 'true' && steps.affected.outputs.web == 'true'
        run: npx nx build potager-web --configuration production

      - name: Déploiement prévisualisation (PR)
        if: steps.cfg.outputs.ready == 'true' && steps.affected.outputs.web == 'true' && github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: ${{ env.HOSTING_TARGET }}
          channelId: pr-${{ github.event.number }}
          expires: 7d

      - name: Déploiement live (master)
        if: steps.cfg.outputs.ready == 'true' && steps.affected.outputs.web == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: ${{ env.HOSTING_TARGET }}
          channelId: live
