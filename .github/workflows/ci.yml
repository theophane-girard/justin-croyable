name: CI

on:
  push:
    branches: [master]
  # Sans filtre de base, une PR empilée sur une branche de travail exécute aussi
  # les vérifications. Le déploiement, lui, reste conditionné plus bas : canal
  # live sur master seulement, canal de prévisualisation sur les PR.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: justin-croyable-story

jobs:
  ci:
    name: Vérifications et déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet requis pour que `nx affected` puisse comparer la
          # branche à sa base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Calcule NX_BASE / NX_HEAD consommés par `nx affected` : base de la PR,
      # ou dernier run réussi sur master pour un push.
      - name: SHAs de base pour nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck et lint
        run: npx nx affected -t typecheck lint

      # Le binaire du navigateur est mis en cache entre les runs. Les
      # dépendances système (apt) sont réinstallées à chaque run car l'OS du
      # runner ne persiste pas.
      - name: Cache du navigateur Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Les stories du DS web s'exécutent comme tests Vitest dans un vrai
      # navigateur : AG Grid mesure des dimensions et ECharts peint dans un
      # canvas, ce qu'un DOM simulé ne fait pas.
      - name: Installation du navigateur de test
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/storybook-web

      - name: Dépendances système du navigateur
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: packages/storybook-web

      - name: Tests
        timeout-minutes: 6
        run: npx nx affected -t test

      - name: Build du Storybook web
        run: npx nx build-storybook @justin-croyable/storybook-web

      - name: Firebase est-il configuré ?
        id: firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Déploiement ignoré : le secret FIREBASE_SERVICE_ACCOUNT est absent des secrets Actions du dépôt."
          fi

      - name: Déploiement sur le canal live
        if: steps.firebase.outputs.ready == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Déploiement d'un canal de prévisualisation
        if: steps.firebase.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          expires: 7d
