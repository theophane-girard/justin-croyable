name: CI

# ATTENTION `paths-ignore` : un push/une PR ne touchant QUE ces chemins ne
# déclenche pas ce workflow — donc aucun check n'est rapporté. Si un jour tu
# passes « CI / Vérifications et builds » en *required status check* dans la
# protection de branche, il faut RETIRER ces `paths-ignore`, sinon toute PR de
# documentation restera bloquée en attente d'un check qui ne viendra jamais.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
  # Sans filtre de base, une PR empilée sur une branche de travail exécute aussi
  # les vérifications. Le déploiement, lui, reste conditionné plus bas : canal
  # live sur master seulement, canal de prévisualisation sur les PR.
  #
  # `ready_for_review` ne fait pas partie des types par défaut : sans lui, une PR
  # sortie de brouillon (voir le `if` du job `verify`) ne serait jamais vérifiée.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'

# Un seul groupe pour toute la chaîne : annuler un run obsolète annule d'un coup
# les vérifications ET les déploiements qui en découlent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: justin-croyable-story

jobs:
  # Source de vérité de la chaîne : seul job à installer les dépendances du
  # front, à calculer les projets affectés et à produire les builds. Les jobs de
  # déploiement en dépendent (`needs: verify`) et ne démarrent donc jamais sur
  # une base rouge.
  verify:
    name: Vérifications et builds
    # Une PR en brouillon ne consomme pas de minutes : la chaîne complète part
    # au passage en « ready for review ». Les jobs de déploiement dépendent de
    # `verify` et sont donc ignorés avec lui.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # nrwl/nx-set-shas interroge l'API Actions sur un push master pour
      # trouver le dernier run réussi (base du diff affected).
      actions: read

    outputs:
      storybook: ${{ steps.affected.outputs.storybook }}
      potager: ${{ steps.affected.outputs.potager }}
      pokemon: ${{ steps.affected.outputs.pokemon }}
      api: ${{ steps.affected.outputs.api }}
      firebase: ${{ steps.firebase.outputs.ready }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet requis pour que `nx affected` puisse comparer la
          # branche à sa base.
          fetch-depth: 0

      - name: Préparation du workspace
        uses: ./.github/actions/setup-workspace

      # Nx rejoue depuis ce cache toute tâche dont les inputs n'ont pas bougé
      # (typecheck, lint, build). Clé unique par commit + `restore-keys` sur le
      # préfixe : le cache est réécrit à chaque run et repart de l'entrée la plus
      # récente. Aucun risque de résultat périmé, Nx hache lui-même ses inputs.
      # Les tests tournent en `--skip-nx-cache` et ne sont donc pas concernés.
      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-

      # Détermine les sites impactés pour ne (re)builder et (re)déployer que
      # ceux-là. S'appuie sur NX_BASE / NX_HEAD posés par l'action ci-dessus.
      # Calculé une seule fois ici, puis relayé aux jobs de déploiement.
      - name: Sites affectés
        id: affected
        uses: ./.github/actions/affected-projects

      # Le contexte `secrets` n'est pas lisible dans un `if:` de job : on le
      # transforme donc en output, consommé par les `if:` des jobs suivants.
      - name: Firebase est-il configuré ?
        id: firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Déploiement ignoré : le secret FIREBASE_SERVICE_ACCOUNT est absent des secrets Actions du dépôt."
          fi

      - name: Typecheck
        run: npx nx affected -t typecheck

      # Les règles de style ESLint sont taguées `warn` (elles ne bloquent pas le
      # lint), ce garde-fou empêche donc d'en ajouter de nouveaux. Contrôle
      # incrémental : on ne linte que les projets affectés et on compare, projet
      # par projet, au budget figé dans tools/eslint-warnings-baseline.json.
      # `--format json` sert au comptage ; eslint échoue déjà seul sur une erreur.
      - name: Lint et budget de warnings
        run: |
          npx nx affected -t lint -- --format json --output-file eslint-report.json
          node tools/check-eslint-warnings.mjs

      # La révision des binaires de navigateur est fixée par playwright-core :
      # caler la clé dessus plutôt que sur le lockfile évite de retélécharger
      # Chromium à chaque bump d'une dépendance sans rapport.
      - name: Version de Playwright
        id: playwright-version
        working-directory: packages/storybook-web
        run: |
          VERSION=$(npx --no-install playwright --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -n "$VERSION" ]; then
            echo "key=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Version de Playwright indéterminée, repli sur le hash du lockfile."
            echo "key=lock-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
          fi

      # Seul le binaire du navigateur est installé, et il est mis en cache entre
      # les runs : sur un hit, l'étape suivante ne tourne pas.
      - name: Cache du navigateur Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.key }}

      # Les stories du DS web s'exécutent comme tests Vitest dans un vrai
      # navigateur : AG Grid mesure des dimensions et ECharts peint dans un
      # canvas, ce qu'un DOM simulé ne fait pas.
      #
      # Volontairement SANS `--with-deps` : l'apt-get des dépendances système
      # coûtait ~2,8 min à CHAQUE run (un tiers du job) alors que l'image
      # ubuntu-latest fournit déjà les libs Chromium — l'ancienne version
      # tolérait d'ailleurs son échec complet et les tests passaient quand même.
      # Si une lib venait à manquer, les tests échoueraient au lancement du
      # navigateur avec un message explicite : rétablir `--with-deps` ici suffit.
      - name: Installation du navigateur de test
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: packages/storybook-web

      # Le mode navigateur Vitest est sujet à des flakes du dev-server (module
      # non servi, iframe déconnectée) qui font échouer le CHARGEMENT d'une
      # suite — que `test.retry` ne peut pas rattraper. On rejoue donc toute la
      # commande, chaque tentative bornée par `timeout` pour couper un blocage.
      - name: Tests
        timeout-minutes: 18
        run: |
          # `nx affected` sélectionne les PROJETS impactés ; `--changed` restreint
          # ENSUITE, au sein de chaque projet Vitest, aux seuls fichiers de test dont
          # le graphe d'imports touche un fichier modifié depuis NX_BASE. Les stories
          # importent le DS en deep import (…/components/<x>), donc changer un composant
          # ne rejoue que SES stories, pas les 47. `--passWithNoTests` : un projet
          # affecté sans test impacté (ex. changement de config) reste vert.
          # Sans NX_BASE (détection en échec), on retombe sur le run complet plutôt que
          # de risquer un skip silencieux.
          ARGS_VITEST=(--passWithNoTests)
          if [ -n "$NX_BASE" ]; then
            ARGS_VITEST+=(--changed "$NX_BASE")
          fi
          for tentative in 1 2 3; do
            echo "::group::Tests — tentative $tentative"
            if timeout 330 npx nx affected -t test --skip-nx-cache -- "${ARGS_VITEST[@]}"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Tests en échec ou bloqués (tentative $tentative/3), nouvelle tentative"
          done
          exit 1

      # L'URL de l'API de staging (Cloud Run) est injectée dans le fichier
      # d'environnement de production AVANT le build : le build produit ici est
      # celui qui part en déploiement, il n'est donc jamais recompilé plus loin.
      # Sans le secret, on garde le placeholder (le build reste fonctionnel mais
      # l'API est injoignable).
      - name: Injecte l'URL de l'API de staging
        if: steps.affected.outputs.potager == 'true'
        env:
          STAGING_API_URL: ${{ secrets.GARDEN_HARVEST_STAGING_API_URL }}
          ENV_FILE: packages/potager-web/src/environments/environment.production.ts
          API_URL_PLACEHOLDER: https://REMPLACER-PAR-URL-CLOUD-RUN
        run: |
          if [ -n "$STAGING_API_URL" ]; then
            sed -i "s|${API_URL_PLACEHOLDER}|${STAGING_API_URL}|" "$ENV_FILE"
          else
            echo "::warning::GARDEN_HARVEST_STAGING_API_URL absent : le front pointera vers le placeholder."
          fi

      - name: Build du Storybook web
        if: steps.affected.outputs.storybook == 'true'
        run: npx nx build-storybook @justin-croyable/storybook-web

      - name: Build de l'app potager
        if: steps.affected.outputs.potager == 'true'
        run: npx nx build @justin-croyable/potager-web --configuration production

      - name: Build de l'app pokemon-comparator
        if: steps.affected.outputs.pokemon == 'true'
        run: npx nx build @justin-croyable/pokemon-comparator-web

      # Les artefacts transportent les builds vers les jobs de déploiement, qui
      # tournent sur des runners neufs. On n'y met QUE des dist/ (quelques Mo) —
      # jamais node_modules, dont le zip/unzip serait plus lent qu'un `npm ci`.
      # Rétention courte : ces builds ne servent qu'au run en cours.
      # Le chemin pointe exactement le dossier `public` de firebase.json :
      # upload-artifact enracine l'archive sur l'ancêtre commun des fichiers,
      # donc uploader le dossier parent perdrait le niveau `browser/`.
      - name: Publication du build Storybook
        if: steps.affected.outputs.storybook == 'true' && steps.firebase.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-storybook-web
          path: dist/storybook-web
          retention-days: 1

      - name: Publication du build potager
        if: steps.affected.outputs.potager == 'true' && steps.firebase.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-potager-web
          path: dist/potager-web/browser
          retention-days: 1

      - name: Publication du build pokemon-comparator
        if: steps.affected.outputs.pokemon == 'true' && steps.firebase.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-pokemon-comparator-web
          path: dist/pokemon-comparator-web/browser
          retention-days: 1

  deploy-storybook:
    name: Déploiement du Storybook
    needs: verify
    if: needs.verify.outputs.firebase == 'true' && needs.verify.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # L'action Firebase commente l'URL de prévisualisation sur la PR.
      pull-requests: write
      checks: write
    steps:
      # Checkout superficiel : seuls firebase.json et .firebaserc sont lus ici,
      # rien n'est recompilé.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déploiement
        uses: ./.github/actions/deploy-firebase-hosting
        with:
          target: storybook
          artifact: dist-storybook-web
          path: dist/storybook-web
          project-id: ${{ env.FIREBASE_PROJECT_ID }}
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-potager:
    name: Déploiement de l'app potager
    needs: verify
    if: needs.verify.outputs.firebase == 'true' && needs.verify.outputs.potager == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déploiement
        uses: ./.github/actions/deploy-firebase-hosting
        with:
          target: potager
          artifact: dist-potager-web
          path: dist/potager-web/browser
          project-id: ${{ env.FIREBASE_PROJECT_ID }}
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-pokemon:
    name: Déploiement de l'app pokemon-comparator
    needs: verify
    if: needs.verify.outputs.firebase == 'true' && needs.verify.outputs.pokemon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déploiement
        uses: ./.github/actions/deploy-firebase-hosting
        with:
          target: pokemon
          artifact: dist-pokemon-comparator-web
          path: dist/pokemon-comparator-web/browser
          project-id: ${{ env.FIREBASE_PROJECT_ID }}
          service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-api:
    name: Build & déploiement backend
    needs: verify
    if: needs.verify.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      SERVICE: potager-api
      REGION: europe-west1
      ARTIFACT_REPO: potager
    steps:
      # Tant que les secrets GCP ne sont pas configurés, tout est ignoré : le job
      # reste vert (même logique de garde que le déploiement Firebase). Ce
      # garde-fou reste local au job : il n'intéresse que le backend.
      - name: GCP configuré ?
        id: gcp
        env:
          SA_KEY: ${{ secrets.GARDEN_HARVEST_GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.GARDEN_HARVEST_GCP_PROJECT_ID }}
          DB_URL: ${{ secrets.GARDEN_HARVEST_DATABASE_URL }}
        run: |
          if [ -n "$SA_KEY" ] && [ -n "$PROJECT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Déploiement backend ignoré : secrets GCP absents (GARDEN_HARVEST_GCP_SA_KEY, GARDEN_HARVEST_GCP_PROJECT_ID). Voir docs/deploy-backend.md."
          fi
          echo "migrate=$([ -n "$DB_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gcp.outputs.ready == 'true'
        uses: actions/checkout@v4

      # `nx-shas: false` : les projets affectés sont déjà connus (calculés par
      # `verify`), ce job n'a pas de diff à recalculer. node_modules reste
      # nécessaire pour la commande de migration Drizzle.
      - name: Préparation du workspace
        if: steps.gcp.outputs.ready == 'true'
        uses: ./.github/actions/setup-workspace
        with:
          nx-shas: 'false'

      - name: Authentification GCP
        id: auth
        if: steps.gcp.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GARDEN_HARVEST_GCP_SA_KEY }}

      - name: Setup gcloud
        if: steps.gcp.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # Migrations Drizzle appliquées à la base cible avant le déploiement.
      # Optionnel : ne s'exécute que si le secret DATABASE_URL est fourni.
      - name: Migrations Drizzle
        if: steps.gcp.outputs.ready == 'true' && steps.gcp.outputs.migrate == 'true'
        env:
          DATABASE_URL: ${{ secrets.GARDEN_HARVEST_DATABASE_URL }}
        run: npx nx db-migrate potager-api

      - name: Build & push de l'image
        id: image
        if: steps.gcp.outputs.ready == 'true'
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ secrets.GARDEN_HARVEST_GCP_PROJECT_ID }}/${ARTIFACT_REPO}/${SERVICE}:${{ github.sha }}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f packages/potager-api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Déploiement live (master)
        if: steps.gcp.outputs.ready == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${{ steps.image.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "^@^NODE_ENV=production@CORS_ORIGIN=${{ secrets.GARDEN_HARVEST_API_CORS_ORIGIN }}@CORS_ORIGIN_REGEX=${{ secrets.GARDEN_HARVEST_API_CORS_ORIGIN_REGEX }}@RNM_REFRESH_TOKEN=${{ secrets.GARDEN_HARVEST_RNM_REFRESH_TOKEN }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest"
          # Les déploiements de preview (--no-traffic --tag) épinglent le trafic ;
          # on force donc la dernière révision à servir 100 % du trafic en live.
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest

      - name: Déploiement prévisualisation (PR)
        id: preview
        if: steps.gcp.outputs.ready == 'true' && github.event_name == 'pull_request'
        run: |
          TAG="pr-${{ github.event.number }}"
          if gcloud run services describe "$SERVICE" --region "$REGION" >/dev/null 2>&1; then
            NO_TRAFFIC="--no-traffic"
          else
            NO_TRAFFIC=""
          fi
          gcloud run deploy "$SERVICE" \
            --image "${{ steps.image.outputs.image }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --tag "$TAG" \
            $NO_TRAFFIC \
            --set-env-vars "^@^NODE_ENV=production@CORS_ORIGIN=${{ secrets.GARDEN_HARVEST_API_CORS_ORIGIN }}@CORS_ORIGIN_REGEX=${{ secrets.GARDEN_HARVEST_API_CORS_ORIGIN_REGEX }}@RNM_REFRESH_TOKEN=${{ secrets.GARDEN_HARVEST_RNM_REFRESH_TOKEN }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest"
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag==$t) | .url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Commentaire URL de prévisualisation
        if: steps.gcp.outputs.ready == 'true' && github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.preview.outputs.url) }};
            const marker = '<!-- preview-backend -->';
            const body = `${marker}\n🚀 **Prévisualisation backend** déployée pour le commit ${context.sha.slice(0, 7)} :\n\n${url}/api\n\n_Sonde : \`GET ${url}/api/health\`_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
