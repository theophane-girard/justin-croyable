name: CI

on:
  push:
    branches: [master]
  # Sans filtre de base, une PR empilée sur une branche de travail exécute aussi
  # les vérifications. Le déploiement, lui, reste conditionné plus bas : canal
  # live sur master seulement, canal de prévisualisation sur les PR.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: justin-croyable-story

jobs:
  ci:
    name: Vérifications et déploiement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
      # nrwl/nx-set-shas interroge l'API Actions sur un push master pour
      # trouver le dernier run réussi (base du diff affected).
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historique complet requis pour que `nx affected` puisse comparer la
          # branche à sa base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Calcule NX_BASE / NX_HEAD consommés par `nx affected` : base de la PR,
      # ou dernier run réussi sur master pour un push.
      - name: SHAs de base pour nx affected
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: master

      - name: Install dependencies
        run: npm ci

      # Détermine les sites impactés pour ne (re)builder et (re)déployer que
      # ceux-là. S'appuie sur NX_BASE / NX_HEAD posés plus haut. En cas d'échec
      # de détection, on retombe sur « tout affecté » pour ne rien manquer.
      - name: Sites affectés
        id: affected
        run: |
          if AFFECTED=$(npx nx show projects --affected --json 2>/dev/null); then
            echo "storybook=$(echo "$AFFECTED" | grep -q 'storybook-web' && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "potager=$(echo "$AFFECTED" | grep -q 'potager-web' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "storybook=true" >> "$GITHUB_OUTPUT"
            echo "potager=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck et lint
        run: npx nx affected -t typecheck lint

      # Le binaire du navigateur est mis en cache entre les runs. Les
      # dépendances système (apt) sont réinstallées à chaque run car l'OS du
      # runner ne persiste pas.
      - name: Cache du navigateur Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Les stories du DS web s'exécutent comme tests Vitest dans un vrai
      # navigateur : AG Grid mesure des dimensions et ECharts peint dans un
      # canvas, ce qu'un DOM simulé ne fait pas.
      - name: Installation du navigateur de test
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: packages/storybook-web

      - name: Dépendances système du navigateur
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: packages/storybook-web

      # Le mode navigateur Vitest est sujet à des flakes du dev-server (module
      # non servi, iframe déconnectée) qui font échouer le CHARGEMENT d'une
      # suite — que `test.retry` ne peut pas rattraper. On rejoue donc toute la
      # commande, chaque tentative bornée par `timeout` pour couper un blocage.
      - name: Tests
        timeout-minutes: 18
        run: |
          for tentative in 1 2 3; do
            echo "::group::Tests — tentative $tentative"
            if timeout 330 npx nx affected -t test --skip-nx-cache; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Tests en échec ou bloqués (tentative $tentative/3), nouvelle tentative"
          done
          exit 1

      - name: Build du Storybook web
        if: steps.affected.outputs.storybook == 'true'
        run: npx nx build-storybook @justin-croyable/storybook-web

      - name: Build de l'app potager
        if: steps.affected.outputs.potager == 'true'
        run: npx nx build @justin-croyable/potager-web

      - name: Firebase est-il configuré ?
        id: firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Déploiement ignoré : le secret FIREBASE_SERVICE_ACCOUNT est absent des secrets Actions du dépôt."
          fi

      - name: Déploiement du Storybook sur le canal live
        if: steps.firebase.outputs.ready == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.affected.outputs.storybook == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: storybook
          channelId: live

      - name: Déploiement de l'app potager sur le canal live
        if: steps.firebase.outputs.ready == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.affected.outputs.potager == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: potager
          channelId: live

      - name: Prévisualisation du Storybook
        if: steps.firebase.outputs.ready == 'true' && github.event_name == 'pull_request' && steps.affected.outputs.storybook == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: storybook
          expires: 7d

      - name: Prévisualisation de l'app potager
        if: steps.firebase.outputs.ready == 'true' && github.event_name == 'pull_request' && steps.affected.outputs.potager == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: potager
          expires: 7d
